# Builds the static export and publishes it to GitHub Pages.
#
# No manual repository setup is needed: the "Configure Pages" step below switches
# the Pages site on by itself. If that is not permitted, the run fails with the
# manual fix spelled out in its summary.
#
# WHY EVERY `uses:` IS A COMMIT SHA
# ---------------------------------
# A tag is a moving pointer. `actions/checkout@v4` means "whatever the checkout
# maintainers — or anyone who compromises that repository — last pushed to the v4
# tag", and that code runs with this workflow's token on this repository's
# source. A 40-character SHA cannot be repointed, so the build stays reproducible
# and a hijacked upstream tag cannot reach this project. The readable version is
# kept in the trailing comment; to update, bump both together.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing an empty commit —
  # useful after changing the Pages settings.
  workflow_dispatch:

# Least privilege: `pages: write` and `id-token: write` are what deploy-pages
# needs to claim the deployment, and `contents: read` is what checkout needs.
# Nothing here writes to the repository, so nothing here can.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should supersede a queued build, but a deploy that has already
# started must be allowed to finish or the site can be left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check types
        # `next build` type-checks the app, but only the files the bundler
        # reaches. This checks the whole project, and — being before the build —
        # fails in ten seconds with the real error rather than five minutes in
        # with a bundler-flavoured one.
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        # The site is served from the root of a custom domain
        # (question.sarojneupane98.com.np, pinned by public/CNAME), so no path prefix
        # is wanted: NEXT_PUBLIC_BASE_PATH stays unset and every URL starts at "/".
        #
        # Were this ever served from a project page instead
        # (https://<user>.github.io/<repo>/), each route and asset would need the
        # repository name as a prefix. Deleting public/CNAME and setting
        #   NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}"
        # here is the whole change — derived from $GITHUB_REPOSITORY rather than
        # written out, so renaming the repository cannot break every asset URL.
        run: npm run build

      - name: Check the build shipped no secrets
        # The export is world-readable the moment it deploys, and an accidental
        # `NEXT_PUBLIC_OPENAI_KEY=...` in a component would be baked straight
        # into a JS chunk. This is cheap, so it runs on every build rather than
        # being trusted to code review.
        run: |
          if grep -rIlE '(sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' out; then
            echo "::error title=Possible secret in the build output::A key-shaped string was found in out/. It would be public the moment this deploys."
            exit 1
          fi
          echo "No key-shaped strings in out/."

      - name: Disable Jekyll
        # The artifact route below does not run Jekyll, so this is belt-and-braces:
        # it keeps Next's `_next/` directory from being swallowed if this repository
        # is ever switched to branch-based Pages, where Jekyll ignores any path
        # beginning with an underscore.
        run: touch out/.nojekyll

      - name: Configure Pages
        id: pages
        # `enablement: true` switches the Pages site on via the API if it does not
        # exist yet, which is the whole of the manual "Settings -> Pages -> Source:
        # GitHub Actions" step. It cannot always succeed on its own — org policy or a
        # fine-grained token can forbid it — so the failure is caught and explained
        # below rather than surfacing as a bare API error.
        #
        # Deliberately no `static_site_generator: next` — that option writes its own
        # Next config to inject a basePath, which would fight the one set above.
        continue-on-error: true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - name: Explain a Pages setup failure
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::Could not enable Pages automatically."
          {
            echo "## GitHub Pages needs to be switched on"
            echo
            echo "The site built correctly — it just has nowhere to publish to yet."
            echo
            echo "Fix it once, by hand:"
            echo
            echo "1. Open <https://github.com/${GITHUB_REPOSITORY}/settings/pages>"
            echo "2. Under **Build and deployment**, set **Source** to **GitHub Actions**"
            echo "3. Come back to the Actions tab and press **Re-run all jobs**"
            echo
            echo "No other setting needs changing."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
